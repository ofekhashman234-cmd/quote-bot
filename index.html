<style>
/* Layout: one-screen app — a single card stage centred on a watercolour cream ground, actions stacked beneath it. */
:root {
  --cream: #FBF4EA;
  --paper: #FFFaF3;
  --ink: #3E4A34;
  --sage: #8FA57D;
  --rose: #E8A096;
  --gold: #B08A4A;
  --gold-soft: #D9C49B;
  --muted: #6F7863;
  --font: "Heebo", "Assistant", "Arial Hebrew", "Segoe UI", Arial, sans-serif;
  --card-w: min(76vw, calc((100vh - 310px) * 0.647), calc((100dvh - 310px) * 0.647), 330px);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button, a, .thumb { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
img { -webkit-user-drag: none; -webkit-touch-callout: none; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font);
  overflow-x: hidden;
  overscroll-behavior: none;
}
/* watercolour wash */
body::after {
  content: "";
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(38vmax 30vmax at 0% 0%, rgba(232,160,150,.30), transparent 70%),
    radial-gradient(34vmax 28vmax at 100% 100%, rgba(143,165,125,.30), transparent 70%),
    radial-gradient(22vmax 18vmax at 100% 8%, rgba(176,138,74,.10), transparent 70%);
}
.app {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 18px;
}
.view { width: 100%; max-width: 520px; flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; }

/* ---------- buttons ---------- */
.btn {
  font: 700 1.06rem/1 var(--font);
  color: var(--paper);
  background: var(--ink);
  border: 0; border-radius: 999px;
  padding: 15px 34px;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(62,74,52,.22), inset 0 0 0 1px rgba(255,255,255,.08);
  transition: transform .15s ease, box-shadow .2s ease;
}
.btn:active { transform: scale(.97); }
.btn:disabled, .ghost:disabled { opacity: .55; pointer-events: none; }
.btn:focus-visible, .ghost:focus-visible, .thumb:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.ghost {
  font: 500 .98rem/1 var(--font);
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--gold-soft);
  border-radius: 999px;
  padding: 12px 20px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex; align-items: center; gap: 8px;
}
.ghost:active { background: rgba(176,138,74,.08); }
.ghost svg { width: 18px; height: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }

/* ---------- welcome ---------- */
.welcome { justify-content: center; text-align: center; gap: 22px; }
.sun { width: 92px; height: auto; }
.welcome h1 {
  margin: 0;
  font-weight: 800;
  font-size: clamp(3.2rem, 17vw, 5rem);
  line-height: 1;
  color: var(--gold);
  letter-spacing: -.01em;
}
.welcome .lead { margin: 0; font-size: clamp(1.25rem, 5.6vw, 1.6rem); font-weight: 700; line-height: 1.4; text-wrap: balance; }
.welcome .small { margin: 0; font-size: 1.02rem; color: var(--muted); }
.divider { display: flex; align-items: center; gap: 10px; color: var(--gold); }
.divider::before, .divider::after { content: ""; width: 54px; height: 1px; background: var(--gold-soft); }
.welcome .btn { margin-top: 10px; }
.welcome .sub-link { margin-top: -4px; }
.text-link { background: none; border: 0; font: 500 .95rem var(--font); color: var(--muted); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; padding: 6px; }

/* ---------- stage ---------- */
.stage-wrap { flex: 1 0 auto; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.eyebrow { margin: 0; font-size: .95rem; font-weight: 500; color: var(--gold); letter-spacing: .02em; text-align: center; min-height: 1.4em; }
.stage { position: relative; width: var(--card-w); aspect-ratio: 359 / 555; max-width: 100%; }
.deck-card, .flip { position: absolute; inset: 0; }
.deck-card { border-radius: 14px; overflow: hidden; box-shadow: 0 8px 22px rgba(62,74,52,.16); transition: opacity .4s ease, transform .4s ease; }
.deck-card:nth-child(1) { transform: rotate(-4deg) translate(-6px, 6px); }
.deck-card:nth-child(2) { transform: rotate(3deg) translate(5px, 4px); }
.deck-card:nth-child(3) { transform: rotate(-1deg); }
.stage.revealed .deck-card { opacity: 0; transform: scale(.94); }
.stage.shuffling .deck-card:nth-child(1) { animation: riffleA .5s ease-in-out 2; }
.stage.shuffling .deck-card:nth-child(2) { animation: riffleB .5s ease-in-out 2 .08s; }
.stage.shuffling .deck-card:nth-child(3) { animation: riffleC .5s ease-in-out 2 .16s; }
.stage.shuffling .flip { animation: riffleTop .5s ease-in-out 2 .04s; }
@keyframes riffleA { 50% { transform: translateX(62%) rotate(9deg); } }
@keyframes riffleB { 50% { transform: translateX(-62%) rotate(-9deg); } }
@keyframes riffleC { 50% { transform: translateY(-14%) rotate(3deg); } }
@keyframes riffleTop { 50% { transform: translateX(-30%) translateY(4%) rotate(-5deg); } }

.flip { perspective: 1400px; cursor: pointer; z-index: 2; border: 0; padding: 0; background: none; }
.flip-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .95s cubic-bezier(.3,.1,.2,1); }
.flip.open .flip-inner { transform: rotateY(180deg); }
.flip.lift .flip-inner { animation: lift .95s ease; }
@keyframes lift { 50% { scale: 1.06; } }
.face {
  position: absolute; inset: 0; border-radius: 14px; overflow: hidden;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 14px 34px rgba(62,74,52,.20), 0 2px 6px rgba(62,74,52,.10);
}
.face.front { transform: rotateY(180deg); background: var(--paper); }
.face.front img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* card back */
.back {
  background:
    radial-gradient(circle at 50% 50%, rgba(232,160,150,.16), transparent 55%),
    radial-gradient(circle at 15% 10%, rgba(143,165,125,.18), transparent 40%),
    radial-gradient(circle at 85% 92%, rgba(232,160,150,.18), transparent 40%),
    var(--cream);
}
.back svg { position: absolute; inset: 0; width: 100%; height: 100%; }

.status { margin: 0; text-align: center; font-size: .98rem; color: var(--muted); line-height: 1.5; min-height: 1.5em; text-wrap: balance; }
.actions { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.fade-in { animation: fadeIn .5s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } }

/* ---------- gallery ---------- */
.view.gallery { flex: 1 1 0; min-height: 0; }
.gallery-head { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 10px; }
.gallery-head h2 { margin: 0; font-size: 1.35rem; font-weight: 800; }
.gallery-head p { margin: 2px 0 0; font-size: .92rem; color: var(--muted); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--gold-soft); background: var(--paper); color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.progress { width: 100%; height: 4px; border-radius: 4px; background: rgba(176,138,74,.16); overflow: hidden; margin-bottom: 14px; }
.progress span { display: block; margin-inline-start: 0; height: 100%; background: linear-gradient(90deg, var(--sage), var(--gold)); border-radius: 4px; }
.grid-scroll { width: 100%; flex: 1 1 0; overflow-y: auto; min-height: 200px; padding-bottom: 12px; -webkit-overflow-scrolling: touch; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.thumb { position: relative; aspect-ratio: 359/555; border-radius: 8px; overflow: hidden; border: 0; padding: 0; cursor: pointer; background: var(--cream); box-shadow: 0 3px 10px rgba(62,74,52,.12); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.locked { cursor: default; opacity: .62; }
.thumb.locked svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.thumb.today::after { content: "היום"; position: absolute; top: 6px; inset-inline-start: 6px; background: var(--ink); color: var(--paper); font: 700 .7rem/1 var(--font); padding: 4px 7px; border-radius: 99px; }
.gallery-foot { padding-top: 12px; }
.status .hint { font-size: .88rem; color: var(--sage); font-weight: 500; }
.nudge { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; background: var(--paper); border: 1px solid var(--gold-soft); border-radius: 16px; padding: 14px 16px; max-width: 340px; }
.nudge p { margin: 0; font-size: 1rem; line-height: 1.5; font-weight: 500; }
.tip { margin: 10px 0 0; font-size: .82rem; color: var(--muted); text-align: center; text-wrap: balance; }

/* ---------- lightbox ---------- */
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(251,244,234,.94); backdrop-filter: blur(6px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.lightbox img { width: min(82vw, calc((100dvh - 170px) * 0.647), 380px); border-radius: 14px; box-shadow: 0 18px 40px rgba(62,74,52,.25); animation: pop .35s ease; }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }

/* ---------- confetti ---------- */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.confetti i { position: absolute; top: -24px; display: block; border-radius: 60% 0 60% 0; animation: fall linear forwards; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); } }

@media (prefers-reduced-motion: reduce) {
  .flip-inner { transition-duration: .01s; }
  .stage.shuffling .deck-card, .stage.shuffling .flip, .flip.lift .flip-inner { animation: none !important; }
  .fade-in, .lightbox img { animation: none; }
}
@media (min-height: 760px) { .welcome { gap: 26px; } }
@media (max-width: 360px) {
  .btn { padding: 13px 22px; font-size: 1rem; }
  .ghost { padding: 10px 13px; font-size: .9rem; gap: 6px; }
  .row { gap: 8px; }
  .icon-btn { width: 40px; height: 40px; }
}
@media (max-height: 620px) {
  .stage-wrap { gap: 10px; }
  .actions { gap: 8px; }
  .status { font-size: .9rem; }
}
</style>

<script>
(() => {
  "use strict";
  document.documentElement.lang = "he";
  document.documentElement.dir = "rtl";

  const TEXTS = {
    1: "מרינה,\nהחפיסה הזו נוצרה במיוחד בשבילך.\nכל בוקר, שלפי קלף אחד",
    2: "הכי יפה זה כשמישהי נשארת נאמנה לעצמה",
    3: "תחגגי את הניצחונות הקטנים",
    4: "הסקרנות שלך היא הכוח שלך",
    5: "עוד קצת סבלנות, ואת שם",
    6: "לאהוב את עצמך זו התחלה של הכל",
    7: "את שווה את כל הטוב שמגיע לך",
    8: "את הדוגמה שאחרים רוצים ללכת בעקבותיה",
    9: "כל מכשול הוא הזדמנות להתחזק",
    10: "אושר הוא לא יעד, הוא הרגל",
    11: "תאמיני בעצמך, אחרים כבר מאמינים",
    12: "מה שמאיר אותך, תעשי יותר ממנו",
    13: "את מנהיגה של החיים שלך",
    14: "גם יום קשה מלמד משהו",
    15: "את מספיקה בדיוק כמו שאת",
    16: "אומץ זה להמשיך גם כשמפחדים",
    17: "תני לעצמך קרדיט, את עשית דרך ארוכה",
    18: "החיים נבנים מרגעים קטנים של בחירה",
    19: "תרשי לעצמך ליהנות מהדרך",
    20: "אל תחכי לרגע המושלם, תהפכי את הרגע הזה לשלך",
    21: "את הופכת דברים קשים לאפשריים",
    22: "הצעד הקטן של היום הוא ההישג של מחר",
    23: "בחרי בעצמך, כל יום מחדש",
    24: "הדרך לא חייבת להיות ברורה כדי שתתחילי ללכת",
    25: "שקט פנימי הוא גם סוג של הצלחה",
    26: "מה שאת נותנת לעולם חוזר אלייך",
    27: "את לא צריכה להיות מושלמת כדי להיות מדהימה",
    28: "כל יום הוא התחלה חדשה",
    29: "הכוח שלך גדול ממה שאת חושבת",
    30: "מותר לעצור, לנשום ולהמשיך",
    31: "קטן ועקבי מנצח גדול ולא קבוע",
    32: "שאלתי את ה-AI\nמי האישה הכי מעוררת השראה שאני מכיר.\nהוא אפילו לא היה צריך לחשוב",
    33: "יום הולדת שמח!\nמרינה\nבאהבה,\nאופק"
  };
  const DAILY = Array.from({ length: 30 }, (_, i) => i + 2); // cards 2..31
  const img = n => `cards/${String(n).padStart(2, "0")}.jpg`;

  // ---------- storage (optional) ----------
  const KEY = "marina-cards-v2";
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  }
  const state = load();
  if (!Array.isArray(state.opened)) state.opened = [];

  // ---------- dates ----------
  function today() {
    let d = new Date();
    try {
      const q = new URLSearchParams(location.search).get("date");
      if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) { const [y, m, dd] = q.split("-").map(Number); d = new Date(y, m - 1, dd, 9); }
    } catch {}
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  const TODAY = today();
  const todayKey = `${TODAY.getFullYear()}-${TODAY.getMonth() + 1}-${TODAY.getDate()}`;

  // The deck's fixed order: "the next card" always follows it; shuffling draws any unopened card.
  function rng(seed) {
    return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const ORDER = (() => {
    const a = DAILY.slice(), r = rng(19700);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  })();

  const introDone = () => state.intro >= 2;
  const isOpen = n => state.opened.includes(n);
  const allOpen = () => DAILY.every(isOpen);
  const openedToday = () => state.today === todayKey ? state.todayCards || [] : [];
  function markOpened(n) {
    if (!isOpen(n)) state.opened.push(n);
    if (state.today !== todayKey) { state.today = todayKey; state.todayCards = []; }
    if (!state.todayCards.includes(n)) state.todayCards.push(n);
    save();
  }
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  function nextCard(exclude) {
    return ORDER.find(n => !isOpen(n)) ?? pick(DAILY.filter(n => n !== exclude));
  }
  function shuffledCard(exclude) {
    const pool = DAILY.filter(n => !isOpen(n));
    return pick(pool.length ? pool : DAILY.filter(n => n !== exclude));
  }
  const revealedSet = () => new Set([1, 32, 33, ...state.opened]);

  const fmtDay = new Intl.DateTimeFormat("he-IL", { weekday: "long", day: "numeric", month: "long" });

  // ---------- DOM helpers ----------
  const app = document.getElementById("app");
  const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const backSVG = `<svg viewBox="0 0 359 555" aria-hidden="true"><use href="#card-back"/></svg>`;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = ms => new Promise(r => setTimeout(r, reduced ? 0 : ms));
  const ICON = {
    grid: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="7" height="10" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="10" rx="1.5"/><rect x="3.5" y="16" width="7" height="4.5" rx="1.2"/><rect x="13.5" y="16" width="7" height="4.5" rx="1.2"/></svg>`,
    share: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12.5v6A2 2 0 0 0 7 20.5h10a2 2 0 0 0 2-2v-6"/></svg>`,
    close: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
    shuffle: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3.5h4.5V8M4 20 20.5 3.5M20.5 16v4.5H16M14.5 14.5l6 6M4 4l5 5"/></svg>`,
    home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg>`
  };

  function preload(n) {
    return new Promise(res => { const i = new Image(); i.onload = i.onerror = () => res(); i.src = img(n); });
  }

  // ---------- views ----------
  function showWelcome() {
    flowId++;
    const first = !introDone();
    const todays = openedToday();
    const label = first ? "שלפי קלף" : todays.length ? "לקלף של היום" : "שלפי את הקלף של היום";
    app.replaceChildren(h(`
      <section class="view welcome fade-in">
        <svg class="sun" viewBox="0 0 120 60" aria-hidden="true">
          <g stroke="#B08A4A" stroke-width="1.4" stroke-linecap="round">
            <path d="M60 22V6M44 26l-6-13M76 26l6-13M32 34l-11-9M88 34l11-9"/>
          </g>
          <path d="M34 52a26 26 0 0 1 52 0z" fill="#E8A096" opacity=".85"/>
          <path d="M14 52h92" stroke="#B08A4A" stroke-width="1.4"/>
          <path d="M28 57h64" stroke="#8FA57D" stroke-width="1.2"/>
        </svg>
        <h1>מרינה</h1>
        <p class="lead">החפיסה הזו נוצרה<br>במיוחד בשבילך.</p>
        <div class="divider" aria-hidden="true">✦</div>
        <p class="small">כל בוקר, שלפי קלף אחד</p>
        <button class="btn" id="go" type="button">${label}</button>
        ${first ? "" : `<button class="text-link sub-link" id="all" type="button">לכל הקלפים</button>`}
      </section>`));
    app.querySelector("#go").onclick = () => {
      if (first) drawFlow(state.intro === 1 ? 32 : 33, "intro");
      else if (todays.length) drawFlow(todays[todays.length - 1], "view");
      else drawFlow(nextCard(), "next");
    };
    const all = app.querySelector("#all");
    if (all) all.onclick = showGallery;
  }

  function stageView(eyebrow) {
    app.replaceChildren(h(`
      <section class="view">
        <div class="stage-wrap">
          <p class="eyebrow" id="eyebrow">${eyebrow}</p>
          <div class="stage" id="stage">
            <div class="deck-card back">${backSVG}</div>
            <div class="deck-card back">${backSVG}</div>
            <div class="deck-card back">${backSVG}</div>
            <button class="flip" id="flip" type="button" aria-label="הפכי את הקלף">
              <div class="flip-inner">
                <div class="face back">${backSVG}</div>
                <div class="face front"><img id="face-img" alt=""></div>
              </div>
            </button>
          </div>
          <p class="status" id="status"></p>
        </div>
        <div class="actions" id="actions"></div>
      </section>`));
    return {
      stage: app.querySelector("#stage"),
      flip: app.querySelector("#flip"),
      face: app.querySelector("#face-img"),
      status: app.querySelector("#status"),
      actions: app.querySelector("#actions"),
      eyebrow: app.querySelector("#eyebrow")
    };
  }

  async function reveal(v, n, { shuffle = true } = {}) {
    v.face.src = img(n);
    v.face.alt = TEXTS[n].replace(/\n/g, " ");
    const ready = preload(n);
    if (shuffle) {
      v.stage.classList.add("shuffling");
      await wait(1150);
      v.stage.classList.remove("shuffling");
    }
    await ready;
    v.stage.classList.add("revealed");
    v.flip.classList.add("open", "lift");
    await wait(950);
    v.flip.classList.remove("lift");
  }

  function shareLink(n) {
    const text = `"${TEXTS[n].replace(/\n/g, " ")}" 💛`;
    return `https://wa.me/?text=${encodeURIComponent(text)}`;
  }

  function addActions(v, buttons) {
    v.actions.replaceChildren(...buttons.map(b => b));
    v.actions.classList.remove("fade-in"); void v.actions.offsetWidth; v.actions.classList.add("fade-in");
  }
  const btn = (label, fn, cls = "btn") => { const b = h(`<button class="${cls}" type="button">${label}</button>`); b.onclick = () => { b.disabled = true; fn(); }; return b; };
  const row = (...els) => { const r = h(`<div class="row"></div>`); r.append(...els); return r; };
  const galleryBtn = () => btn(`${ICON.grid}כל הקלפים`, showGallery, "ghost");
  const shareBtn = n => h(`<a class="ghost" target="_blank" rel="noopener" href="${shareLink(n)}">${ICON.share}שיתוף</a>`);

  // A gentle nudge, once a day, before opening more than one card.
  function gate(box0, go) {
    if (!openedToday().length || state.warned === todayKey) return go();
    const restore = [...box0.childNodes];
    const box = h(`
      <div class="nudge">
        <p>המלצה קטנה: קלף אחד ביום,<br>וכל בוקר מחכה לך הפתעה חדשה.</p>
      </div>`);
    const yes = btn("לפתוח עוד אחד", () => { state.warned = todayKey; save(); go(); });
    const no = btn("אחכה למחר", () => { restore.forEach(el => { if (el.disabled !== undefined) el.disabled = false; el.querySelectorAll?.("button").forEach(b => b.disabled = false); }); box0.replaceChildren(...restore); }, "ghost");
    box.append(row(yes, no));
    box0.replaceChildren(box);
  }

  let flowId = 0;
  async function drawFlow(n, mode) {
    const id = ++flowId;
    const shuffle = mode === "shuffle" || (mode === "intro" && n === 33);
    const firstToday = !openedToday().length || openedToday()[0] === n;
    const eyebrow = mode === "intro" && n === 33 ? "קלף ראשון, במיוחד להיום"
      : mode === "intro" ? "ועוד קלף אחד, לפני שמתחילים"
      : firstToday ? `הקלף של ${fmtDay.format(TODAY)}` : "עוד קלף להיום";
    const v = stageView(eyebrow);
    v.status.textContent = shuffle ? "רגע, מערבבים…" : "";
    v.flip.onclick = () => { if (v.stage.classList.contains("revealed")) v.flip.classList.toggle("open"); };

    await reveal(v, n, { shuffle });
    if (id !== flowId || !v.stage.isConnected) return;

    if (mode === "intro" && n === 33) {
      confetti();
      state.intro = Math.max(state.intro || 0, 1); save();
      v.status.textContent = "מזל טוב! 🎂";
      addActions(v, [btn("יש עוד קלף בשבילך", () => drawFlow(32, "intro"))]);
      return;
    }
    if (mode === "intro") {
      state.intro = 2; save();
      v.status.textContent = "ומכאן, קלף אחד בכל בוקר.";
      addActions(v, [btn("לקלף הראשון בחפיסה", () => drawFlow(nextCard(), "next"))]);
      return;
    }

    state.intro = 2;
    markOpened(n);
    if (n === 33) confetti();
    const count = DAILY.filter(isOpen).length;
    v.status.innerHTML = allOpen()
      ? "פתחת את כל החפיסה 💛<br>מכאן כל שליפה היא מכל הקלפים"
      : `נפתחו ${count} מתוך 30 קלפים<br><span class="hint">מומלץ: קלף אחד בכל בוקר</span>`;
    const home = btn(ICON.home, showWelcome, "icon-btn");
    home.setAttribute("aria-label", "למסך הפתיחה");
    addActions(v, [
      row(
        btn("לקלף הבא", () => gate(v.actions, () => drawFlow(nextCard(n), "next"))),
        btn(`${ICON.shuffle}ערבבי ושלפי`, () => gate(v.actions, () => drawFlow(shuffledCard(n), "shuffle")), "ghost")
      ),
      row(galleryBtn(), shareBtn(n), home)
    ]);
  }

  function showGallery() {
    flowId++;
    const open = revealedSet();
    const order = [1, 33, 32, ...state.opened];
    ORDER.forEach(n => { if (!order.includes(n)) order.push(n); });
    const count = open.size;
    const todays = openedToday();
    const view = h(`
      <section class="view gallery fade-in">
        <header class="gallery-head">
          <div>
            <h2>החפיסה שלך</h2>
            <p>נפתחו ${count} מתוך 33 קלפים</p>
          </div>
          <button class="icon-btn" id="home" type="button" aria-label="למסך הפתיחה">${ICON.home}</button>
        </header>
        <div class="progress" aria-hidden="true"><span style="width:${(count / 33 * 100).toFixed(1)}%"></span></div>
        <div class="grid-scroll"><div class="grid" id="grid"></div></div>
        <div class="gallery-foot row" id="foot"></div>
        <p class="tip">מומלץ לפתוח קלף אחד בכל בוקר. ואפשר להוסיף את האתר למסך הבית, ואז הוא נפתח כמו אפליקציה.</p>
      </section>`);
    const grid = view.querySelector("#grid");
    order.forEach(n => {
      if (open.has(n)) {
        const b = h(`<button class="thumb${todays.includes(n) ? " today" : ""}" type="button"><img loading="lazy" src="${img(n)}" alt=""></button>`);
        b.querySelector("img").alt = TEXTS[n].replace(/\n/g, " ");
        b.onclick = () => lightbox(n);
        grid.append(b);
      } else {
        grid.append(h(`<div class="thumb locked back" aria-label="קלף שעוד לא נפתח">${backSVG}</div>`));
      }
    });
    const foot = view.querySelector("#foot");
    const go = fn => () => gate(foot, fn);
    if (introDone()) {
      foot.append(
        btn(todays.length ? "לקלף הבא" : "שלפי את הקלף של היום", go(() => drawFlow(nextCard(), "next"))),
        btn(`${ICON.shuffle}ערבבי ושלפי`, go(() => drawFlow(shuffledCard(), "shuffle")), "ghost")
      );
    }
    view.querySelector("#home").onclick = showWelcome;
    app.replaceChildren(view);
  }

  function lightbox(n) {
    const lb = h(`
      <div class="lightbox" role="dialog" aria-modal="true">
        <img src="${img(n)}" alt="">
        <div class="row">
          <a class="ghost" target="_blank" rel="noopener" href="${shareLink(n)}">${ICON.share}שתפי</a>
          <button class="ghost" type="button" id="lb-close">${ICON.close}סגירה</button>
        </div>
      </div>`);
    lb.querySelector("img").alt = TEXTS[n].replace(/\n/g, " ");
    const close = () => { lb.remove(); document.removeEventListener("keydown", esc); };
    const esc = e => { if (e.key === "Escape") close(); };
    lb.onclick = e => { if (e.target === lb || e.target.tagName === "IMG") close(); };
    lb.querySelector("#lb-close").onclick = close;
    document.addEventListener("keydown", esc);
    document.body.append(lb);
    lb.querySelector("#lb-close").focus();
  }

  function confetti() {
    if (reduced) return;
    const box = h(`<div class="confetti" aria-hidden="true"></div>`);
    const colors = ["#E8A096", "#8FA57D", "#B08A4A", "#F2C9C1", "#C9D6BC"];
    for (let i = 0; i < 46; i++) {
      const p = document.createElement("i");
      const s = 7 + Math.random() * 9;
      p.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s * 1.3}px;background:${colors[i % colors.length]};` +
        `--dx:${(Math.random() * 120 - 60).toFixed(0)}px;--rot:${(Math.random() * 720 - 360).toFixed(0)}deg;` +
        `animation-duration:${(2.8 + Math.random() * 2.2).toFixed(2)}s;animation-delay:${(Math.random() * .9).toFixed(2)}s;opacity:.9`;
      box.append(p);
    }
    document.body.append(box);
    setTimeout(() => box.remove(), 6500);
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && today().getTime() !== TODAY.getTime()) location.reload();
  });

  // preload the card she'll see first
  preload(introDone() ? nextCard() : 33);
  showWelcome();
})();
</script>
</body></html>
