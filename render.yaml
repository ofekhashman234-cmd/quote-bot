# הגדרות פריסה ל-Render (אירוח חינמי בענן) — גרסת Docker.
# Render קורא את הקובץ הזה אוטומטית ובונה את ה-Dockerfile (שכבר מכיל את Chrome).
# את הערכים הסודיים (מפתח/סיסמה) מגדירים בלוח הבקרה של Render, לא כאן.
services:
  - type: web
    name: quote-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # להזין ידנית בלוח הבקרה
      - key: APP_PASSWORD
        sync: false        # הסיסמה לכניסה לאתר
